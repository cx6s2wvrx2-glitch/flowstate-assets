name: Flowstate IG Publisher
on:
  schedule:
    - cron: '17 6 * * *'    # ~πρωί
    - cron: '47 6 * * *'
    - cron: '17 7 * * *'
    - cron: '47 7 * * *'
    - cron: '13 14 * * *'   # ~απόγευμα
    - cron: '43 14 * * *'
    - cron: '13 15 * * *'
    - cron: '43 15 * * *'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python scripts/ig_publish.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
