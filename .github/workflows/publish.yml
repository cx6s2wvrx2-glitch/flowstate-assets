name: Flowstate IG Publisher
on:
  schedule:
    - cron: '0 6 * * *'    # 09:00 Athens (summer)
    - cron: '0 7 * * *'    # 09:00 Athens (winter)
    - cron: '0 14 * * *'   # 17:00 Athens (summer)
    - cron: '0 15 * * *'   # 17:00 Athens (winter)
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python scripts/ig_publish.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
